name: SYNAPSE Automated Delivery & Release (CD)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'
      is_draft:
        description: 'Create draft release?'
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD GATEWAY MULTI-ARCH BINARIES (GO)
  # =========================================================================
  build-gateway-binaries:
    name: Build Gateway Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: synapse-gateway-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: synapse-gateway-linux-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        working-directory: src_go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o ../dist/${{ matrix.output_name }} ./cmd/gateway

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          if-no-files-found: error

  # =========================================================================
  # 2. PUBLISH GITHUB RELEASE
  # =========================================================================
  publish-release:
    name: Create GitHub Release & Upload Assets
    needs: [build-gateway-binaries]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Directory
        run: mkdir -p release_assets

      - name: Download Gateway AMD64 Binary
        uses: actions/download-artifact@v4
        with:
          name: synapse-gateway-linux-amd64
          path: release_assets/

      - name: Download Gateway ARM64 Binary
        uses: actions/download-artifact@v4
        with:
          name: synapse-gateway-linux-arm64
          path: release_assets/

      - name: Generate Checksums (SHA256)
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "SYNAPSE CORE ${{ steps.release_info.outputs.tag }}"
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: release_assets/*
