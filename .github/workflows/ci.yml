name: SYNAPSE Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # 1. SYNAPSE-GO INGESTION GATEWAY
  # =========================================================================
  gateway-go:
    name: Gateway (Go 1.22)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src_go

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: src_go/go.sum

      - name: Verify Go Modules
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests (with Race Detector)
        run: |
          go test -v -race -coverprofile=coverage-go.out -covermode=atomic ./...

      - name: Compile Gateway Binary
        run: |
          mkdir -p ../bin
          go build -ldflags="-s -w" -o ../bin/synapse-gateway ./cmd/gateway

      - name: Upload Go Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-gateway-binary
          path: bin/synapse-gateway
          if-no-files-found: error

  # =========================================================================
  # 2. FRONTEND UI (REACT 18 + VITE + TYPESCRIPT)
  # =========================================================================
  frontend-ui:
    name: Frontend (React 18 & Vite)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Web Bundle
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-ui-dist
          path: ui/dist
          if-no-files-found: error

  # =========================================================================
  # 3. TAURI V2 DESKTOP BACKEND (RUST)
  # =========================================================================
  desktop-tauri:
    name: Desktop Shell (Tauri v2 & Rust)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          manifest-path: ui/src-tauri/Cargo.toml

      - name: Check Rust Code Compilation
        run: cargo check --manifest-path ui/src-tauri/Cargo.toml

      - name: Run Rust Unit Tests
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml

  # =========================================================================
  # 4. PYTHON CORE & MARKVART™ NEURAL BACKEND
  # =========================================================================
  backend-python:
    name: Backend Core (Python 3.12 & MARKVART™)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Graphics & Headless Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libcairo2-dev \
            pkg-config \
            build-essential

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade Pip & Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install PyTorch (Optimized CPU Wheels for CI)
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install Production & Dev Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint Code Quality Check (Ruff)
        run: |
          ruff check src/ tests/ --exit-zero

      - name: Run PyTest Test Suite (Headless with Xvfb)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          xvfb-run -a pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term --durations=15

      - name: Upload Python Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore


