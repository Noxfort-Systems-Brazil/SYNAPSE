version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Python Backend dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain Frontend React dependencies
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain Go Ingestion Gateway dependencies
  - package-ecosystem: "gomod"
    directory: "/src_go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Desktop Tauri Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/ui/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
